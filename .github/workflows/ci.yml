name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build does not connect to a database; a placeholder satisfies config.
          DATABASE_URL: "file:./ci.db"
          AUTH_SECRET: "ci-secret"
