# The only Render resource in this blueprint is explicitly free.
# PostgreSQL and provider credentials are supplied through the dashboard.
services:
  - type: web
    name: castcheck
    runtime: node
    plan: free
    repo: https://github.com/tkhokage/castcheck
    branch: codex/castcheck-production-rebuild
    buildCommand: npm ci --include=dev && node scripts/set-db-provider.mjs postgresql && npx prisma generate && npm run build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS
        value: "false"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_SECURITY_EMAIL
        sync: false
